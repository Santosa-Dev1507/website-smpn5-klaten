<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMPN Manajemen</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <?!= include('Stylesheet'); ?>
</head>
<body class="bg-[#f9f9fb] text-[#1a1c1d] min-h-screen" style="font-family:'Inter',sans-serif">

  <!-- TOP APP BAR -->
  <header class="bg-[#f9f9fb] shadow-sm fixed top-0 w-full z-40 h-16 flex justify-between items-center px-6 border-b border-[#c6c5d4]/40">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-[#1a237e] flex items-center justify-center">
        <span class="material-symbols-outlined text-[#8690ee] text-lg" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">school</span>
      </div>
      <span class="text-base font-bold text-[#000666]">SMPN Manajemen</span>
    </div>
    <div class="flex items-center gap-2">
      <button class="p-2 hover:bg-[#f3f3f5] rounded-full relative transition-colors">
        <span class="material-symbols-outlined text-[#454652] text-xl">notifications</span>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#ba1a1a] rounded-full"></span>
      </button>
      <div class="flex items-center gap-2 ml-1">
        <div class="text-right hidden sm:block">
          <p class="text-xs font-semibold text-[#1a1c1d]" id="headerNama">—</p>
          <p class="text-[10px] text-[#454652]" id="headerRole">—</p>
        </div>
        <button onclick="handleLogout()" class="w-9 h-9 rounded-full bg-[#000666] flex items-center justify-center text-white text-xs font-bold hover:opacity-80 transition-opacity" id="avatarBtn" title="Keluar">
          <span id="avatarInitials">?</span>
        </button>
      </div>
    </div>
  </header>

  <!-- SIDEBAR (Desktop) -->
  <aside id="sidebar" class="hidden lg:flex flex-col fixed left-0 top-16 h-[calc(100vh-64px)] w-64 bg-[#f9f9fb] border-r border-[#c6c5d4]/50 p-4 gap-1 z-30 overflow-y-auto">
    <div class="mb-4 p-3 bg-[#f3f3f5] rounded-xl">
      <div class="flex items-center gap-3 mb-1">
        <div class="w-9 h-9 rounded-full bg-[#1a237e] flex items-center justify-center text-[#8690ee] text-sm font-bold" id="sidebarAvatar">?</div>
        <div>
          <p class="text-sm font-bold text-[#000666]" id="sidebarNama">Memuat...</p>
          <p class="text-[10px] text-[#454652]" id="sidebarRole">—</p>
        </div>
      </div>
      <p class="text-[10px] text-[#767683] px-1">SMPN 5 Klaten</p>
    </div>
    <nav id="sidebarNav" class="flex flex-col gap-1"></nav>
    <div class="mt-auto pt-4 border-t border-[#c6c5d4]/50">
      <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2 text-[#ba1a1a] hover:bg-[#ffdad6] rounded-r-full transition-colors text-sm font-semibold">
        <span class="material-symbols-outlined text-base">logout</span>
        <span>Keluar</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="lg:ml-64 pt-16 min-h-screen pb-24 lg:pb-8">
    <div id="pageContent" class="p-4 lg:p-6 max-w-[1280px] mx-auto">
      <!-- Loading spinner -->
      <div id="loadingSpinner" class="flex flex-col items-center justify-center min-h-[60vh]">
        <div class="w-12 h-12 border-4 border-[#c6c5d4] border-t-[#000666] rounded-full animate-spin mb-4"></div>
        <p class="text-[#454652] text-sm">Memuat data...</p>
      </div>
    </div>
  </main>

  <!-- BOTTOM NAV (Mobile) -->
  <nav id="bottomNav" class="lg:hidden fixed bottom-0 left-0 w-full bg-white shadow-lg border-t border-[#c6c5d4]/50 flex justify-around items-center px-2 py-2 z-40 rounded-t-xl">
    <!-- diisi dinamis oleh JS -->
  </nav>

  <!-- MODAL KONFIRMASI LOGOUT -->
  <div id="logoutModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
      <div class="w-12 h-12 bg-[#ffdad6] rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-[#ba1a1a]" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">logout</span>
      </div>
      <h3 class="text-base font-bold text-[#1a1c1d] text-center mb-2">Keluar dari Sistem?</h3>
      <p class="text-sm text-[#454652] text-center mb-6">Sesi Anda akan diakhiri dan Anda perlu login kembali.</p>
      <div class="flex gap-3">
        <button onclick="closeLogoutModal()" class="flex-1 py-2.5 rounded-xl border-2 border-[#c6c5d4] text-[#1a1c1d] font-semibold text-sm hover:bg-[#f3f3f5]">Batal</button>
        <button onclick="confirmLogout()" class="flex-1 py-2.5 rounded-xl bg-[#ba1a1a] text-white font-semibold text-sm hover:opacity-90">Ya, Keluar</button>
      </div>
    </div>
  </div>

  <?!= include('JavaScript'); ?>
</body>
</html>
